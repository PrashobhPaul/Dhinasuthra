<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="An illustration of DhinaSuthra's visual language: a rhythm score ring, a 24-hour day ribbon with one episode inspected, and a week heatmap">
