  <text x="48" y="290" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#E9EEF9" font-weight="600">Closely following</text>
  <text x="48" y="313" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#E9EEF9" font-weight="600">your usual rhythm</text>
