name: Publish APK

# Keeps a permanently valid download link alive for the README.
#
# Every push to main builds the app and publishes it as a GitHub Release marked
# "latest", so this URL always serves the newest build and never needs editing:
#
#   https://github.com/PrashobhPaul/Dhinasuthra/releases/latest/download/dhinasuthra.apk
#
# (The CI workflow's artifact upload is different: artifacts expire and require a
# GitHub login. A release asset is public and permanent.)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version name
        id: version
        run: |
          NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon

      - name: Privacy audits
        run: |
          bash scripts/audit-permissions.sh
          bash scripts/audit-network.sh

      - name: Stage APK under a stable name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/dhinasuthra.apk
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          **DhinaSuthra ${VERSION}** · build ${GITHUB_RUN_NUMBER}

          Download \`dhinasuthra.apk\` below, open it on your phone, and allow your
          file manager to install unknown apps when prompted.

          This is a debug-signed build, so Play Protect may ask you to confirm.
          It still holds **no INTERNET permission** — the privacy audits in this
          workflow fail the build if that ever changes.

          Built from \`${GITHUB_SHA}\`.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/dhinasuthra.apk --clobber
          else
            gh release create "$TAG" dist/dhinasuthra.apk \
              --title "DhinaSuthra ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
              --notes "$NOTES" \
              --latest
          fi
